<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Leviticus 1-10 Easy Bible Quiz</title>
<style>
    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        max-width: 900px;
        margin: 0 auto;
        padding: 20px 15px;
        background: #f9f9f9;
        color: #111;
        line-height: 1.5;
    }
    h1 {
        text-align: center;
        color: #1a3c6d;
        margin: 1.2em 0 0.6em;
        font-size: 2rem;
    }
    .small-text {
        display: block;
        text-align: center;
        color: #555;
        font-size: 0.95rem;
        margin-bottom: 2rem;
    }
    .question {
        background: white;
        border-radius: 10px;
        padding: 1.4rem;
        margin: 1.5rem 0;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        border-left: 5px solid #3b82f6;
    }
    .question h3 {
        margin: 0 0 1.1rem 0;
        font-size: 1.22rem;
        color: #1e3a8a;
    }
    .option-label {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 12px;
        margin: 10px 0;
        border-radius: 8px;
        background: #f8fafc;
        cursor: pointer;
        transition: background-color 0.15s ease;
        min-height: 48px;
        user-select: none;
    }
    .option-label:hover {
        background: #eef4ff;
    }
    input[type="radio"] {
        margin: 0;
        flex-shrink: 0;
        width: 20px;
        height: 20px;
        accent-color: #3b82f6;
    }
    .option-label span {
        flex: 1;
        line-height: 1.4;
    }
    button {
        display: block;
        margin: 2.5rem auto;
        padding: 1rem 2.5rem;
        font-size: 1.15rem;
        background: #10b981;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
        transition: background 0.2s;
    }
    button:hover {
        background: #059669;
    }
    button:disabled {
        background: #6b7280;
        cursor: not-allowed;
    }
    #results {
        display: none;
        margin-top: 2rem;
        padding: 1.5rem;
        background: #ecfdf5;
        border-radius: 10px;
    }
    .score {
        text-align: center;
        font-size: 1.8rem;
        margin-bottom: 1.8rem;
        color: #065f46;
        font-weight: bold;
    }
    .result-item {
        background: white;
        border-radius: 10px;
        padding: 1.2rem;
        margin: 1rem 0;
        box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }
    .correct { color: #059669; font-weight: bold; }
    .incorrect { color: #dc2626; font-weight: bold; }
    .explanation {
        margin-top: 1rem;
        padding: 1rem;
        background: #f0fdf4;
        border-left: 4px solid #10b981;
        border-radius: 6px;
        font-size: 0.95rem;
    }
    @media (max-width: 600px) {
        body { padding: 15px 12px; }
        h1 { font-size: 1.7rem; }
        .question { padding: 1.2rem; margin: 1.2rem 0; }
        .option-label {
            gap: 10px;
            padding: 12px 10px;
            margin: 12px 0;
        }
        input[type="radio"] {
            width: 22px;
            height: 22px;
        }
        .score { font-size: 1.5rem; }
    }
</style>
</head>
<body>
<h1>Leviticus 1-10 Easy Bible Quiz</h1>
<span class="small-text">50 questions • Multiple Choice • Detailed explanations • NIV/ESV based</span>
<div id="quiz"></div>
<button id="submitBtn" onclick="checkAnswers()">Submit & See Score + Explanations</button>
<div id="results"></div>

<script>
const questions = [
  { type: "mc", q: "From where did the LORD speak to Moses about the offerings?", a: "From the Tent of Meeting", opts: ["From Mount Sinai", "From the Tent of Meeting", "From heaven directly", "From a burning bush"], expl: "Leviticus 1:1 – The LORD called to Moses from the Tent of Meeting after the tabernacle was set up." },
  { type: "mc", q: "What was the basic requirement for an animal used in a burnt offering from the herd?", a: "Male and without defect", opts: ["Female and healthy", "Male and without defect", "Any age or gender", "Only young calves"], expl: "Leviticus 1:3 – It had to be a male without defect to be acceptable." },
  { type: "mc", q: "In the burnt offering, what did the worshiper do first with the animal?", a: "Lay his hand on its head", opts: ["Lay his hand on its head", "Kill it immediately", "Wash it with water", "Cut it into pieces"], expl: "Leviticus 1:4 – Laying on of hands symbolized identification and transfer of sin." },
  { type: "mc", q: "Which offering was completely burned on the altar (no portion eaten)?", a: "Burnt offering", opts: ["Sin offering", "Burnt offering", "Peace offering", "Grain offering"], expl: "Leviticus 1:9,13,17 – The whole animal (except skin) was burned as a pleasing aroma to the LORD." },
  { type: "mc", q: "What main ingredients were used in the grain offering?", a: "Fine flour, oil, and frankincense", opts: ["Bread and wine", "Fine flour, oil, and frankincense", "Salt and honey only", "Meat and blood"], expl: "Leviticus 2:1 – Fine flour mixed with oil and frankincense; no leaven or honey allowed in baked form." },
  { type: "mc", q: "What was never to be missing from any grain offering?", a: "Salt", opts: ["Salt", "Leaven", "Honey", "Blood"], expl: "Leviticus 2:13 – Salt of the covenant was required in every grain offering." },
  { type: "mc", q: "The peace offering could be offered for what main purpose?", a: "To express thanksgiving or fellowship with God", opts: ["To atone for sin", "To express thanksgiving or fellowship with God", "Only for priests", "To curse enemies"], expl: "Leviticus 3; 7:11–15 – Also called fellowship/well-being offering; parts eaten by offerer, priests, and burned." },
  { type: "mc", q: "In the sin offering, whose sin required a bull as sacrifice?", a: "The anointed priest", opts: ["A common person", "The anointed priest", "The whole congregation", "A ruler"], expl: "Leviticus 4:3 – High priest's unintentional sin required a bull." },
  { type: "mc", q: "What was done with the blood in the sin offering for the congregation?", a: "Sprinkled before the veil and on the horns of the altar", opts: ["Poured out at the base", "Sprinkled before the veil and on the horns of the altar", "Eaten by priests", "Thrown outside camp"], expl: "Leviticus 4:6–7,17–18 – Special handling to make atonement." },
  { type: "mc", q: "The guilt (trespass/reparation) offering often required restitution plus what?", a: "One-fifth extra", opts: ["Double the value", "One-fifth extra", "Nothing extra", "A vow"], expl: "Leviticus 5:16; 6:5 – Restitution + 20% added, plus a ram." },
  { type: "mc", q: "Who could eat the meat of the sin offering if it was for an individual?", a: "The officiating priests", opts: ["Anyone", "The officiating priests", "Only the high priest", "The offerer"], expl: "Leviticus 6:26 – Priests ate it in a holy place." },
  { type: "mc", q: "What was the wave offering part of in peace offerings?", a: "The breast", opts: ["The fat", "The breast", "The blood", "The head"], expl: "Leviticus 7:30–31 – Breast waved before the LORD, then eaten by priests." },
  { type: "mc", q: "Who was consecrated as high priest in Leviticus 8?", a: "Aaron", opts: ["Moses", "Aaron", "Nadab", "Eleazar"], expl: "Leviticus 8:1–12 – Aaron and sons washed, clothed, anointed." },
  { type: "mc", q: "What was placed on Aaron's right ear, thumb, and big toe during ordination?", a: "Blood and anointing oil", opts: ["Only oil", "Blood and anointing oil", "Frankincense", "Fine flour"], expl: "Leviticus 8:23–24,30 – Symbolized hearing, doing, and walking in God's ways." },
  { type: "mc", q: "How many days did the ordination ceremony last?", a: "Seven", opts: ["Three", "Seven", "Eight", "One"], expl: "Leviticus 8:33–35 – Seven days of consecration." },
  { type: "mc", q: "On the eighth day, what happened after Aaron offered sacrifices?", a: "Fire from the LORD consumed the offerings", opts: ["Rain fell", "Fire from the LORD consumed the offerings", "The people left", "Moses died"], expl: "Leviticus 9:24 – God accepted the offerings with fire from His presence." },
  { type: "mc", q: "Who offered unauthorized fire before the LORD?", a: "Nadab and Abihu", opts: ["Aaron and Ithamar", "Nadab and Abihu", "Moses and Eleazar", "The elders"], expl: "Leviticus 10:1 – They offered strange fire and were consumed by fire from the LORD." },
  { type: "mc", q: "What command was given after Nadab and Abihu's death regarding drink?", a: "No wine or fermented drink when entering the Tent", opts: ["Drink only water", "No wine or fermented drink when entering the Tent", "Drink freely", "Only priests abstain"], expl: "Leviticus 10:9 – To distinguish between holy and common." },
  { type: "mc", q: "Which offering had no portion for the priests but was wholly for the LORD?", a: "Burnt offering", opts: ["Peace offering", "Burnt offering", "Grain offering", "Sin offering"], expl: "Leviticus 1 – Entirely burned; priests got the skin (1:6–9)." },
  { type: "mc", q: "What animal could the poor offer for burnt offering instead of bull or sheep?", a: "Turtledoves or young pigeons", opts: ["Goats only", "Turtledoves or young pigeons", "Flour only", "Lambs"], expl: "Leviticus 1:14 – Provision for the poor." },
  { type: "mc", q: "In the grain offering, what was forbidden to be burned?", a: "Leaven or honey", opts: ["Salt", "Leaven or honey", "Oil", "Frankincense"], expl: "Leviticus 2:11 – Leaven and honey not allowed in fire offerings." },
  { type: "mc", q: "The fat of the peace offering belonged to whom?", a: "The LORD", opts: ["The offerer", "The LORD", "The poor", "The Levites"], expl: "Leviticus 3:16 – Fat burned as food offering to the LORD." },
  { type: "mc", q: "For unintentional sin of a ruler, what animal was required in sin offering?", a: "Male goat", opts: ["Bull", "Male goat", "Lamb", "Dove"], expl: "Leviticus 4:22–23 – A male goat without defect." },
  { type: "mc", q: "What could the very poor bring for sin offering instead of animals?", a: "Fine flour", opts: ["Bread", "Fine flour", "Water", "Incense"], expl: "Leviticus 5:11 – Tenth of an ephah of fine flour." },
  { type: "mc", q: "In guilt offering, the ram had to be what?", a: "Without defect", opts: ["Young only", "Without defect", "Female", "Any ram"], expl: "Leviticus 5:15; 6:6 – Ram without defect." },
  { type: "mc", q: "What was burned on the altar every morning in burnt offering law?", a: "The ashes from previous offering", opts: ["New animal daily", "The ashes from previous offering", "Incense only", "Grain"], expl: "Leviticus 6:9–10 – Priest removed ashes; continual fire." },
  { type: "mc", q: "Who ate the remainder of the grain offering after a handful was burned?", a: "Aaron and his sons", opts: ["The offerer", "Aaron and his sons", "The poor", "Everyone"], expl: "Leviticus 6:16–18 – Eaten unleavened in holy place." },
  { type: "mc", q: "Blood was never to be eaten because it is the what?", a: "Life", opts: ["Pleasure", "Life", "Strength", "Color"], expl: "Leviticus 7:26–27 (context in offerings) – Life is in the blood." },
  { type: "mc", q: "The ordination ram's blood was applied where?", a: "On altar horns and sprinkled around", opts: ["Only on priests", "On altar horns and sprinkled around", "On the people", "On the veil"], expl: "Leviticus 8:15 – Atonement for altar." },
  { type: "mc", q: "What was poured out at the base of the altar in ordination?", a: "Remaining blood", opts: ["Oil", "Remaining blood", "Wine", "Water"], expl: "Leviticus 8:15; 9:9 – Standard practice." },
  { type: "mc", q: "After ordination, Aaron blessed whom?", a: "The people", opts: ["Moses only", "The people", "The priests", "The animals"], expl: "Leviticus 9:22 – Aaron lifted hands and blessed the people." },
  { type: "mc", q: "Why were Nadab and Abihu consumed by fire?", a: "They offered unauthorized fire", opts: ["They stole", "They offered unauthorized fire", "They lied", "They ate fat"], expl: "Leviticus 10:1–2 – Strange/unauthorized fire not commanded." },
  { type: "mc", q: "Moses told Aaron not to mourn outwardly because?", a: "They were anointed priests", opts: ["They were guilty", "They were anointed priests", "It was Sabbath", "God forbade tears"], expl: "Leviticus 10:6–7 – Anointed with oil; not to uncover heads or tear clothes." },
  { type: "mc", q: "Priests were to teach Israel the difference between?", a: "Holy and common, clean and unclean", opts: ["Rich and poor", "Holy and common, clean and unclean", "Day and night", "Food and drink"], expl: "Leviticus 10:10–11 – After Nadab/Abihu incident." },
  { type: "mc", q: "What offering's fat and breast went to the priest?", a: "Peace offering", opts: ["Burnt offering", "Peace offering", "Sin offering", "Guilt offering"], expl: "Leviticus 7:31–34 – Perpetual due to Aaron's sons." },
  { type: "mc", q: "The sin offering's blood for high priest was brought where?", a: "Inside the Tent to the veil", opts: ["Outside camp", "Inside the Tent to the veil", "To the people", "To Moses"], expl: "Leviticus 4:6–7 – Sprinkled before veil." },
  { type: "mc", q: "Which offering symbolized complete dedication to God?", a: "Burnt offering", opts: ["Grain offering", "Burnt offering", "Peace offering", "Sin offering"], expl: "Leviticus 1 – Whole animal burned; voluntary wholehearted surrender." },
  { type: "mc", q: "In Leviticus 9, what did the people do when they saw God's glory?", a: "Shouted and fell facedown", opts: ["Ran away", "Shouted and fell facedown", "Sang songs", "Offered more animals"], expl: "Leviticus 9:23–24 – They shouted for joy and fell facedown." },
  { type: "mc", q: "The handful of grain offering burned was called what?", a: "Memorial portion", opts: ["Whole offering", "Memorial portion", "Heave offering", "Wave offering"], expl: "Leviticus 2:2 – Memorial portion as aroma to LORD." },
  { type: "mc", q: "What was forbidden to eat from peace offering if unclean?", a: "The meat", opts: ["The fat", "The meat", "The blood", "The skin"], expl: "Leviticus 7:20–21 – Unclean person eating it cut off." },
  { type: "mc", q: "Aaron's sons left after Nadab and Abihu were whom?", a: "Eleazar and Ithamar", opts: ["Moses and Eleazar", "Eleazar and Ithamar", "Nadab only", "All died"], expl: "Leviticus 10:6 – Remaining sons." },
  { type: "mc", q: "The burnt offering was to be offered how often?", a: "Continually, morning and evening", opts: ["Once a year", "Continually, morning and evening", "Only on Sabbath", "Weekly"], expl: "Leviticus 6:9–13 – Fire kept burning continually." },
  { type: "mc", q: "In sin offering, the carcass of the bull was burned where?", a: "Outside the camp", opts: ["On the altar", "Outside the camp", "In the Tent", "By the people"], expl: "Leviticus 4:12 – Where ashes are poured out." },
  { type: "mc", q: "The grain offering could be baked as what?", a: "Unleavened cakes or wafers", opts: ["Leavened bread", "Unleavened cakes or wafers", "Honey cakes", "Meat pies"], expl: "Leviticus 2:4–5 – Unleavened." },
  { type: "mc", q: "Who sprinkled blood around the altar in burnt offering?", a: "The priest", opts: ["The offerer", "The priest", "Moses", "The people"], expl: "Leviticus 1:5,11 – Priest dashed blood against altar." },
  { type: "mc", q: "Leviticus 1–7 mainly gives instructions from whose perspective?", a: "The offerer's", opts: ["The priest's only", "The offerer's", "Moses' only", "God's only"], expl: "Chapters 1–5 to people; 6–7 repeat for priests." },
  { type: "mc", q: "What symbolized God's acceptance on the eighth day?", a: "Fire from His presence", opts: ["Rain", "Fire from His presence", "Thunder", "Wind"], expl: "Leviticus 9:24 – Consumed the burnt offering and fat." },
  { type: "mc", q: "The heave offering from peace offering went to whom?", a: "The priests", opts: ["The offerer", "The priests", "The poor", "The altar"], expl: "Leviticus 7:32–34 – Thigh as heave offering." }
];

const quizContainer = document.getElementById("quiz");
let questionNumber = 1;

questions.forEach((q, index) => {
    const qDiv = document.createElement("div");
    qDiv.className = "question";
    qDiv.innerHTML = `<h3>${questionNumber}. ${q.q}</h3>`;
    questionNumber++;
    if (q.type === "mc") {
        q.opts.forEach(option => {
            const label = document.createElement("label");
            label.className = "option-label";
            const radio = document.createElement("input");
            radio.type = "radio";
            radio.name = `question-${index}`;
            radio.value = option;
            const span = document.createElement("span");
            span.textContent = option;
            label.appendChild(radio);
            label.appendChild(span);
            qDiv.appendChild(label);
        });
    }
    quizContainer.appendChild(qDiv);
});

function checkAnswers() {
    const submitBtn = document.getElementById("submitBtn");
    submitBtn.disabled = true;
    let correctCount = 0;
    let html = '';
    questions.forEach((q, i) => {
        const selected = document.querySelector(`input[name="question-${i}"]:checked`);
        const userAnswer = selected ? selected.value : null;
        const correctAnswer = q.a;
        const isCorrect = userAnswer === correctAnswer;
        if (isCorrect) correctCount++;
        html += `
            <div class="result-item">
                <h3>${i+1}. ${q.q}</h3>
                <p class="${isCorrect ? 'correct' : 'incorrect'}">
                    ${isCorrect ? "Correct!" : (userAnswer === null ? "No answer" : "Incorrect")}
                    → Answer: <strong>${correctAnswer}</strong>
                </p>
                <div class="explanation"><strong>Explanation:</strong> ${q.expl}</div>
            </div>
        `;
    });
    const percentage = ((correctCount / questions.length) * 100).toFixed(1);
    const scoreHtml = `<div class="score">Score: ${correctCount} / ${questions.length} (${percentage}%)</div>`;
    document.getElementById("results").innerHTML = scoreHtml + html;
    document.getElementById("results").style.display = "block";
    window.scrollTo({ top: document.getElementById("results").offsetTop - 80, behavior: "smooth" });
}
</script>
</body>
</html>
